# CI for a repo with three independent Gradle sub-projects.
# Uses the repo-root Gradle wrapper with -p <subdir>, so each sub-project
# builds against its own settings.gradle.kts without duplicating the
# wrapper jar three times.
# Place at: .github/workflows/ci.yml

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one red sub-project doesn't cancel the others
      matrix:
        project: [memory-leak-detector, property-file-tool, thread-lock-detector, unused-code-detector]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test (${{ matrix.project }})
        run: |
          # Root wrapper drives each sub-project via -p. Falls back to
          # java -jar if there is no gradlew script at the repo root.
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew -p ${{ matrix.project }} build
          else
            java -jar gradle/wrapper/gradle-wrapper.jar -p ${{ matrix.project }} build
          fi

      - name: Upload test reports (${{ matrix.project }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.project }}
          path: ${{ matrix.project }}/**/build/reports/tests/test

  # --- Optional: SonarQube quality gate ---

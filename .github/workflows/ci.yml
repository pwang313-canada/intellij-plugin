# CI for a repo with three independent Gradle sub-projects.
# Each sub-project has its own wrapper + settings.gradle.kts,
# so they build in parallel via a matrix.
# Place at: .github/workflows/ci.yml

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one red sub-project doesn't cancel the others
      matrix:
        project: [memory-leak-detector, property-file-tool, thread-lock-detector]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test (${{ matrix.project }})
        working-directory: ${{ matrix.project }}
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload test reports (${{ matrix.project }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.project }}
          path: ${{ matrix.project }}/**/build/reports/tests/test

